name: Update Streak Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the updated SVG back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          # Pass queries as a URL parameter string under 'options'
          options: "user=nimish-nirmal&theme=tokyonight&hide_border=true"
          path: build/streak-stats.svg

      - name: Commit Updated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update streak stats SVG"
